  <h1>Tasuki</h1>
  <p>Tasukiは、カレンダー上でタスクと目標を管理するアプリです。</p>

  <ul>
    <li>カレンダーでのタスク管理</li>
    <li>目標の設定と進捗管理</li>
    <li>Gmail APIを利用したメール通知</li>
  </ul>
